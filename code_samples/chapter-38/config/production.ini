# Production environment configuration
# Overrides default.ini for production deployment

[crawler]
rate_limit = 5
concurrent_workers = 8
timeout = 60
max_file_size_mb = 100

[database] 
host = db.production.example.com
port = 5432
pool_size = 20
max_overflow = 50

[storage]
base_path = /data/stdlib-demo/documents
temp_path = /data/stdlib-demo/temp
archive_path = /data/stdlib-demo/archive

[analytics]
window_size = 10000
metrics_retention_hours = 168  # 1 week

[processing]
batch_size = 500
cache_ttl_seconds = 7200  # 2 hours

[logging]
level = WARNING
file_path = /var/log/stdlib-demo/application.log