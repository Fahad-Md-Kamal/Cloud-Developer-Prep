# Development environment configuration
# Overrides default.ini for local development

[crawler]
rate_limit = 2
concurrent_workers = 2
timeout = 15

[database]
host = localhost
name = stdlib_demo_dev
pool_size = 5

[storage]
base_path = ./dev_data/documents
temp_path = ./dev_data/temp
archive_path = ./dev_data/archive

[processing]
batch_size = 10
cache_ttl_seconds = 300  # 5 minutes for faster testing

[logging]
level = DEBUG
file_path = logs/stdlib_demo_dev.log