# Default configuration for Standard Library Demo System
# Base settings common across all environments

[crawler]
rate_limit = 10
user_agent = StandardLibraryDemo/1.0
timeout = 30
retry_attempts = 3
concurrent_workers = 4
max_file_size_mb = 50

[database]
host = localhost
port = 5432
name = stdlib_demo
pool_size = 10
max_overflow = 20

[storage]
base_path = ./demo_data/documents
temp_path = ./demo_data/temp
archive_path = ./demo_data/archive

[analytics]
window_size = 5000
metrics_retention_hours = 24

[processing]
batch_size = 100
cache_ttl_seconds = 3600
enable_caching = true
enable_monitoring = true

[logging]
level = INFO
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
file_path = logs/stdlib_demo.log
max_file_size = 10MB
backup_count = 5

[security]
# API key should be set via environment variable: STDLIB_DEMO_SECURITY_API_KEY  
api_key = demo_api_key_replace_in_production