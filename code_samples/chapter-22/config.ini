# Configuration file for Chapter 22 code samples
# Production-ready configuration for Conversational AI systems

[database]
# PostgreSQL configuration for Lawstronaut legal database
legal_database_url = postgresql://legal_user:secure_password@legal-db:5432/lawstronaut_db
legal_database_pool_size = 20
legal_database_max_overflow = 30
legal_database_timeout = 30

# ClickHouse configuration for Optimizely analytics
analytics_database_url = clickhouse://analytics_user:analytics_password@analytics-db:8123/optimizely_analytics
analytics_batch_size = 1000
analytics_buffer_size = 10000

[redis]
# Redis configuration for caching and session management
redis_url = redis://redis-cluster:6379/0
redis_password = redis_secure_password
redis_max_connections = 50
redis_retry_attempts = 3
redis_retry_delay = 1

# Session configuration
session_timeout_minutes = 60
session_cleanup_interval = 300

[api]
# FastAPI configuration
host = 0.0.0.0
port = 8080
workers = 4
max_request_size = 10485760  # 10MB
request_timeout = 300
keepalive_timeout = 5

# CORS configuration
allowed_origins = https://app.lawstronaut.com,https://app.optimizely.com
allowed_methods = GET,POST,PUT,DELETE,OPTIONS
allowed_headers = *

# Rate limiting
rate_limit_requests_per_minute = 60
rate_limit_burst_size = 10

[agents]
# LangChain agent configuration
legal_agent_timeout = 30
legal_agent_max_retries = 3
legal_research_database_path = /data/legal_research.db

personalization_agent_timeout = 20
personalization_agent_max_retries = 3
analytics_api_endpoint = https://analytics.optimizely.com/api/v1

# Memory configuration
conversation_memory_size = 20
entity_memory_size = 1000

[orchestration]
# Multi-agent orchestration
max_concurrent_workflows = 50
workflow_timeout = 300
task_retry_delay = 2
max_task_retries = 3

# Agent pool configuration
legal_agent_pool_size = 5
personalization_agent_pool_size = 8

[monitoring]
# Health check configuration
health_check_interval = 30
health_check_timeout = 10

# Metrics collection
metrics_collection_interval = 60
metrics_retention_hours = 168  # 7 days
metrics_aggregation_window = 300  # 5 minutes

# Circuit breaker configuration
circuit_breaker_failure_threshold = 5
circuit_breaker_recovery_timeout = 60
circuit_breaker_success_threshold = 3

[logging]
# Logging configuration
log_level = INFO
log_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
log_file = /var/log/conversational_ai/app.log
log_max_bytes = 104857600  # 100MB
log_backup_count = 5

# Structured logging
enable_json_logging = true
enable_correlation_ids = true

[security]
# JWT configuration
jwt_secret_key = your-super-secure-jwt-secret-key-change-in-production
jwt_algorithm = HS256
jwt_expiration_hours = 24

# API keys for external services
openai_api_key = your-openai-api-key
anthropic_api_key = your-anthropic-api-key

# Encryption
data_encryption_key = your-32-byte-encryption-key-change-in-production

[deployment]
# Kubernetes deployment configuration
namespace = conversational-ai
replicas = 6
cpu_request = 500m
cpu_limit = 1000m
memory_request = 1Gi
memory_limit = 2Gi

# Auto-scaling
min_replicas = 3
max_replicas = 20
cpu_threshold = 70
memory_threshold = 80
scale_up_cooldown = 300
scale_down_cooldown = 600

# Health checks
liveness_probe_path = /health/live
readiness_probe_path = /health/ready
startup_probe_path = /health/startup
probe_timeout = 10
probe_period = 30

[features]
# Feature flags
enable_streaming_responses = true
enable_websocket_support = true
enable_conversation_analytics = true
enable_auto_scaling = true
enable_circuit_breakers = true

# Legal domain features (Lawstronaut)
enable_contract_analysis = true
enable_compliance_checking = true
enable_risk_assessment = true
enable_clause_extraction = true

# Personalization features (Optimizely)
enable_ab_testing = true
enable_user_segmentation = true
enable_content_optimization = true
enable_conversion_tracking = true

[performance]
# Performance tuning
worker_connections = 1000
max_queue_size = 10000
connection_pool_size = 25
query_timeout = 30

# Caching
enable_response_caching = true
cache_ttl_seconds = 3600
cache_max_size = 1000

# Async configuration
async_timeout = 30
async_max_workers = 10