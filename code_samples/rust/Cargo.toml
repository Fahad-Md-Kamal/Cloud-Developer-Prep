[package]
name = "rust-guru-samples"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Runnable examples for the Rust track of the Cloud Developer Prep site"

[lib]
name = "guru_samples"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
fancy = []

[dev-dependencies]
proptest = "1"
