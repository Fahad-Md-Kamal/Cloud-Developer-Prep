[package]
name = "rust-guru-samples"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Runnable examples for the Rust track of the Cloud Developer Prep site"

[lib]
name = "guru_samples"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
fancy = []

[dev-dependencies]
proptest = "1"

# The samples demonstrate pitfalls on purpose (NaN comparisons, drop order of
# `if let`, ...), so these lints would flag the lesson itself.
[lints.clippy]
needless_range_loop = "allow"
redundant_pattern_matching = "allow"
eq_op = "allow"
type_complexity = "allow"
cast_nan_to_int = "allow"
deref_addrof = "allow"
needless_lifetimes = "allow"
question_mark = "allow"
redundant_closure = "allow"
transmute_int_to_bool = "allow"
useless_vec = "allow"
