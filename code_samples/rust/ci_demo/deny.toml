# cargo-deny configuration. Run: cargo deny check
[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Unlicense"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
