[package]
name = "async-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Rayon, Tokio and loom samples for the Concurrency & Async pages"

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dependencies]
futures = "0.3.34"
rayon = "1.12.0"
tokio = { version = "1.54.1", features = ["full", "test-util"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"

[target."cfg(loom)".dependencies]
loom = "0.7.2"
